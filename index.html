<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stöberstuuv Kasse</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#ee7a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kasse">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
@font-face{font-family:"Abril Fatface";src:url(abril-fatface.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Kaushan Script";src:url(kaushan-script.woff2) format("woff2");font-weight:400;font-display:swap}
:root{--bg:#f2f0ed;--card:#fff;--ink:#1c1714;--mute:#6b625a;--line:#dcd6cf;--or:#ee7a1a;--or-ink:#1c1714;--copper:#8f4a0e;--glow:#fbf6c2;--warn:#b3402a;--staff:#f5ebe0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161210;--card:#211b17;--ink:#f4ede7;--mute:#a99d93;--line:#3b332d;--or:#f58a2e;--copper:#f2a566;--glow:#3b3617;--warn:#ef8a73;--staff:#33261a}}
:root[data-theme="dark"]{--bg:#161210;--card:#211b17;--ink:#f4ede7;--mute:#a99d93;--line:#3b332d;--or:#f58a2e;--copper:#f2a566;--glow:#3b3617;--warn:#ef8a73;--staff:#33261a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--or);outline-offset:2px}
button:disabled{cursor:default}

/* Kopf mit Logo-Anmutung */
.top{display:flex;align-items:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) 14px 8px;background:var(--card);border-bottom:4px solid var(--or);position:sticky;top:0;z-index:5}
.mark{height:52px;width:auto;display:block}
.brand{display:flex;flex-direction:column;line-height:1;margin-right:auto}
.b1{font:400 1.45rem "Abril Fatface",Georgia,serif;letter-spacing:.02em}
.b2{font:400 1rem "Kaushan Script",cursive;color:var(--copper);margin:3px 0 0 1.3em}
.menu{min-height:44px;padding:0 12px;border:2px solid var(--ink);border-radius:999px;background:none;font-weight:700;white-space:nowrap}
.help{width:44px;height:44px;border:2px solid var(--ink);border-radius:50%;background:none;font-weight:800;font-size:1.2rem;flex:none}
body[data-view=admin] .menu{background:var(--ink);color:var(--card)}
@media(max-width:380px){.b2{display:none}}

main{max-width:1040px;margin:0 auto;padding:14px 14px 110px}
@media(min-width:760px){main{padding-bottom:30px}}

/* Kategorie-Reiter */
.cats,.seg{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.cats::-webkit-scrollbar,.seg::-webkit-scrollbar{display:none}
.ctab,.seg button{flex:1 0 auto;min-height:50px;padding:0 14px;border:2px solid var(--ink);border-radius:999px;background:var(--card);font-weight:700;white-space:nowrap}
.seg{gap:6px}
.seg button{flex:1 1 auto;min-height:44px;padding:0 8px;font-size:.9rem}
.ctab[aria-selected=true],.seg button[aria-selected=true]{background:var(--ink);color:var(--card)}
.ctab i{font-style:normal;background:var(--or);color:var(--or-ink);border-radius:999px;padding:1px 8px;margin-left:8px;font-size:.85rem}

/* Kasse */
.kasse{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;align-content:start}
.prod{position:relative;background:var(--card);border:1px solid var(--line);border-bottom:5px solid var(--or);border-radius:12px;min-height:100px;padding:22px 8px 14px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:4px}
.prod:active{background:var(--glow)}
.prod b{font-size:1.1rem}
.prod span{color:var(--copper);font-weight:700}
.qty{position:absolute;top:6px;right:6px;min-width:26px;height:26px;padding:0 7px;border-radius:999px;background:var(--or);color:var(--or-ink);font-style:normal;font-weight:800;font-size:.9rem;display:grid;place-items:center}
.empty{color:var(--mute);padding:10px 0;margin:0}
.hint{color:var(--mute);font-size:.9rem}

.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.phead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.phead h2{font:400 1.3rem "Abril Fatface",Georgia,serif;margin:0}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.row .n{flex:1}
.row .s{min-width:66px;text-align:right}
.sm{border:1px solid var(--line);background:none;border-radius:8px;width:40px;height:40px;line-height:1;font-size:1.1rem}
.total{display:flex;justify-content:space-between;align-items:baseline;font-size:1.6rem;font-weight:800;margin:12px 0}
label.hint{display:block;margin-bottom:4px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.quick button{border:1px solid var(--line);background:none;border-radius:10px;padding:10px 4px;flex:1;min-height:44px;font-weight:600;white-space:nowrap}
.quick button:first-child{flex:2}
input[type=text],select{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.change{border-radius:12px;padding:12px 14px;margin:10px 0;background:var(--glow);font-size:1.2rem;display:flex;justify-content:space-between;align-items:baseline}
.change strong{font-size:1.6rem}
.change.neg{background:none;border:2px dashed var(--warn);color:var(--warn)}
.main{width:100%;border:0;background:var(--or);color:var(--or-ink);border-radius:12px;min-height:54px;font-weight:800;font-size:1.1rem}
.main:disabled{opacity:.4}
.two{display:flex;gap:8px;margin-top:10px}
.staffbtn{flex:1;min-height:48px;border:2px solid var(--copper);background:var(--staff);color:var(--copper);border-radius:12px;font-weight:700}
.staffbtn:disabled{opacity:.4}
.ghost{border:1px solid var(--line);background:none;border-radius:10px;padding:10px 14px;min-height:44px}
.ghost:disabled{opacity:.4}
.danger{color:var(--warn);border-color:var(--warn)}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;padding:12px 0 2px;width:100%}
.link:disabled{opacity:.4;text-decoration:none}

.cartbar,.scrim{display:none}
@media(min-width:760px){
  .kasse{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
  .panel{position:sticky;top:88px}
  .closebtn{display:none}
}
@media(max-width:759px){
  .panel{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;padding-bottom:max(14px,env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.3)}
  .panel.open{display:block}
  .scrim{display:block;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);visibility:hidden}
  .panel.open ~ .scrim{visibility:visible}
  .cartbar{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:10;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--card);border:0;border-radius:16px;padding:10px 10px 10px 18px;min-height:62px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .cartbar span{flex:1;text-align:left}
  .cartbar strong{font-size:1.25rem}
  .cartbar em{font-style:normal;background:var(--or);color:var(--or-ink);padding:12px 16px;border-radius:12px}
  .cartbar:disabled{opacity:.6}
  .cartbar:disabled em{display:none}
  body.sheet-open{overflow:hidden}
}
@media(max-width:759px) and (prefers-reduced-motion:no-preference){
  .panel.open{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
}

/* Hinweise, Dialoge */
#banner:empty{display:none}
#banner{max-width:1040px;margin:10px auto 0;padding:0 14px}
#banner div{background:var(--glow);border:1px solid var(--or);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:12px 18px;border-radius:12px;font-weight:600;z-index:80;max-width:90vw;text-align:center;display:none;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#toast.show{display:block}
@media(min-width:760px){#toast{bottom:30px}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:70;padding:16px}
#modal.show{display:flex}
.dlg{background:var(--card);border-radius:18px;padding:20px;max-width:440px;width:100%;max-height:92vh;overflow:auto;border-top:6px solid var(--copper)}
.dlg h2{font:400 1.4rem "Abril Fatface",Georgia,serif;margin:0 0 8px}
.dlg p{margin:8px 0}
.dlg ol{padding-left:1.3em;margin:8px 0}
.dlg li{margin:6px 0}
.dlg .btns{display:flex;gap:10px;margin-top:16px}
.dlg .btns button{flex:1;min-height:52px}
.staffok,.okbtn,.warnok{border:0;border-radius:10px;font-weight:700;padding:10px 14px}
.staffok{background:var(--copper);color:var(--card)}
.okbtn{background:var(--or);color:var(--or-ink)}
.warnok{background:var(--warn);color:var(--card)}
.dlg.pin{border-top-color:var(--or);text-align:center}
.dots{display:flex;gap:16px;justify-content:center;margin:14px 0 4px}
.dots i{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink)}
.dots i.on{background:var(--ink)}
.perr{color:var(--warn);min-height:1.5em;margin:4px 0 8px;font-weight:600}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{min-height:62px;border:1px solid var(--line);border-radius:14px;background:var(--bg);font-size:1.5rem;font-weight:700}
.pad button.ghost{font-size:1rem;font-weight:600}

/* Verwaltung */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpis div{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--or);border-radius:12px;padding:12px}
.kpis div.staff{border-top-color:var(--copper);background:var(--staff)}
.kpis small{color:var(--mute);display:block}
.kpis b{font-size:1.45rem}
h3{font:400 1.25rem "Abril Fatface",Georgia,serif;margin:18px 0 8px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px}
th,td{padding:10px;text-align:right;border-bottom:1px solid var(--line)}
th{font-size:.85rem;color:var(--mute);font-weight:600}
th:first-child,td:first-child{text-align:left}
.bar{height:8px;background:var(--or);border-radius:4px}
@media(max-width:600px){.bc{display:none}th,td{padding:10px 6px}}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.box h2{font-size:1.05rem;margin:0 0 6px}
.box p{margin:6px 0}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btns .main{width:auto;padding:0 20px}
.cathead{display:flex;gap:8px;margin-bottom:12px}
.cathead input{font-weight:700}
.prow{display:grid;grid-template-columns:1fr 100px;gap:8px;margin-bottom:12px}
.acts{display:flex;gap:6px;justify-content:flex-end}
.newrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.newrow.cat{grid-template-columns:1fr auto}
.logocard{background:#fff;border-radius:16px;padding:10px;max-width:440px;margin:26px auto 0}
.logocard img{width:100%;height:auto;display:block}
.lastorder{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--glow);border:1px solid var(--or);border-left-width:6px;border-radius:12px;padding:8px 10px 8px 14px;margin-bottom:10px}
.lastorder.staff{background:var(--staff);border-color:var(--copper)}
.lo-nr{display:flex;flex-direction:column;line-height:1;min-width:64px}
.lo-nr small{color:var(--mute);font-size:.8rem;margin-bottom:2px}
.lo-nr b{font:400 2.4rem "Abril Fatface",Georgia,serif}
.lo-info{flex:1 1 120px;font-size:.95rem;min-width:0}
.lastorder>button{flex:none}
.lastorder>.sm{margin-left:auto}
.lo-info span{display:block;color:var(--mute);font-size:.85rem}
.lo-info span.bad{color:var(--warn);font-weight:600}
.printstat{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--mute);margin:0 2px 10px}
.printstat i{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block;flex:none}
.printstat i.on{background:#3a9d5d}
.printstat .ghost{min-height:36px;padding:4px 12px}
.paper{box-sizing:content-box;background:#fff;color:#1c1714;width:32ch;max-width:100%;margin:12px auto 0;padding:14px 12px;font-family:ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:13px;line-height:1.35;border:1px solid var(--line);overflow:hidden}
.paper div{white-space:pre}
.chk{display:flex;align-items:center;gap:10px;min-height:44px}
.chk input{width:22px;height:22px;flex:none}
details.adv{margin-top:10px}
details.adv summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--mute)}
.field{display:grid;gap:4px;margin:10px 0}
</style>
</head>
<body data-view="kasse">
<header class="top">
  <img class="mark" src="mark.png" alt="">
  <div class="brand"><span class="b1">Stöberstuuv</span><span class="b2">Siebeneichen</span></div>
  <button class="help" onclick="showHelp()" aria-label="Hilfe: So geht's">?</button>
  <button class="menu" id="menuBtn" onclick="toggleView()">Verwaltung</button>
</header>
<div id="banner"></div>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal"></div>

<script>
const fmt=c=>(c/100).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const parse=s=>{const v=parseFloat(String(s).replace(',','.'));return isNaN(v)?null:Math.round(v*100)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=c=>(c/100).toFixed(2).replace('.',',');

/* ---------- Daten ---------- */
const DEF_CATS=['Essen','Trinken','Kaffee & Kuchen'];
const OLD_MAP={Bratwurst:'Essen',Pommes:'Essen',Bier:'Trinken',Wasser:'Trinken',Kuchen:'Kaffee & Kuchen',Kaffee:'Kaffee & Kuchen'};
// bringt Daten aus älteren Versionen auf den aktuellen Stand
function norm(d){
 if(!Array.isArray(d.cats)||!d.cats.length)d.cats=DEF_CATS.map((n,i)=>({id:i+1,name:n}));
 d.nextCat=Math.max(Number.isInteger(d.nextCat)?d.nextCat:1,...d.cats.map(c=>c.id+1));
 d.products.forEach(p=>{
  if(!d.cats.some(c=>c.id===p.cat)){
   const c=d.cats.find(c=>c.name===OLD_MAP[p.name])||d.cats[0];p.cat=c.id;
  }
 });
 d.next=Math.max(Number.isInteger(d.next)?d.next:1,...d.products.map(p=>p.id+1));
 d.lastBackup=d.lastBackup||0;d.backupCount=d.backupCount||0;
 d.pin=typeof d.pin==='string'?d.pin:'';d.contact=typeof d.contact==='string'?d.contact:'';
 d.orderNo=Number.isInteger(d.orderNo)&&d.orderNo>=1&&d.orderNo<=999?d.orderNo:1;
 d.bon=Object.assign({on:false,auto:true,title:'Stöberstuuv Siebeneichen',width:32,charset:'437',speed:'safe',cutter:false,device:''},d.bon||{});
 if(!Array.isArray(d.bonCats)){const e=d.cats.find(c=>c.name==='Essen')||d.cats[0];d.bonCats=[e.id]}
 d.bonCats=d.bonCats.filter(id=>d.cats.some(c=>c.id===id));
 return d;
}
function defaults(){return norm({
 cats:DEF_CATS.map((n,i)=>({id:i+1,name:n})),
 products:[
  {id:1,name:'Bratwurst',price:300,cat:1},{id:2,name:'Pommes',price:250,cat:1},
  {id:3,name:'Bier',price:300,cat:2},{id:4,name:'Wasser',price:150,cat:2},{id:5,name:'Apfelschorle',price:200,cat:2},
  {id:6,name:'Kaffee',price:150,cat:3},{id:7,name:'Kuchen',price:200,cat:3}],
 sales:[]})}
let st,savedRaw=null;
try{savedRaw=localStorage.getItem('vereinskasse');if(savedRaw)st=JSON.parse(savedRaw)}catch(e){}
st=(st&&Array.isArray(st.products)&&Array.isArray(st.sales))?norm(st):defaults();
let saveFail=false;
const save=()=>{try{localStorage.setItem('vereinskasse',JSON.stringify(st));saveFail=false}catch(e){saveFail=true}};

let view='kasse',adminTab='stat',cat=st.cats[0].id,cart={},paid='',sheet=false,unlocked=false,pinCtx=null,lastOrder=null;
const prodById=id=>st.products.find(p=>p.id==id);
const catName=id=>{const c=st.cats.find(c=>c.id===id);return c?c.name:''};
const total=()=>Object.entries(cart).reduce((a,[id,q])=>a+q*prodById(id).price,0);
const count=()=>Object.values(cart).reduce((a,q)=>a+q,0);
function curCat(){if(!st.cats.some(c=>c.id===cat))cat=st.cats[0].id;return cat}

/* ---------- Darstellung ---------- */
function render(){
 Object.keys(cart).forEach(id=>{if(!prodById(id))delete cart[id]});
 const old=document.querySelector('.panel'),sc=old?old.scrollTop:0;
 document.body.dataset.view=view;
 document.body.classList.toggle('sheet-open',sheet&&view==='kasse');
 document.getElementById('menuBtn').textContent=view==='kasse'?'Verwaltung':'Zur Kasse';
 document.getElementById('app').innerHTML=view==='kasse'?kasse():admin();
 const np=document.querySelector('.panel');if(np&&sc)np.scrollTop=sc;
 banner();
}
function toggleView(){if(view==='admin')go('kasse');else go('admin')}
function go(v,t){
 if(v==='admin'&&st.pin&&!unlocked){openAdmin(t);return}
 if(v!=='admin')unlocked=false;
 view=v;if(t)adminTab=t;sheet=false;render();window.scrollTo(0,0);
 if(v==='admin'&&adminTab==='backup')persistInfo();
}
function openAdmin(t){
 if(!st.pin){unlocked=true;go('admin',t);return}
 pinDialog('Verwaltung öffnen','Gib die 4-stellige PIN ein.',v=>{
  if(pinHash(v)!==st.pin)return 'Falsche PIN. Bitte noch einmal versuchen.';
  unlocked=true;setTimeout(()=>go('admin',t),0);return true;
 },true);
}

function kasse(){
 const c=curCat(),t=total(),n=count(),p=parse(paid),back=p===null?null:p-t,items=Object.entries(cart);
 const tabs=st.cats.map(k=>{
  const k_n=items.reduce((a,[id,q])=>a+(prodById(id).cat===k.id?q:0),0);
  return `<button class="ctab" role="tab" aria-selected="${k.id===c}" onclick="setCat(${k.id})">${esc(k.name)}${k_n?`<i>${k_n}</i>`:''}</button>`}).join('');
 const prods=st.products.filter(x=>x.cat===c);
 const grid=prods.length?prods.map(x=>`<button class="prod" onclick="add(${x.id})">${cart[x.id]?`<i class="qty">${cart[x.id]}</i>`:''}<b>${esc(x.name)}</b><span>${fmt(x.price)}</span></button>`).join(''):`<p class="empty">In „${esc(catName(c))}“ gibt es noch keine Artikel. Lege sie unter Verwaltung → Artikel an.</p>`;
 const lines=items.length?items.map(([id,q])=>{const x=prodById(id);return `<div class="row"><span class="n">${esc(x.name)}</span><button class="sm" onclick="chg(${id},-1)" aria-label="${esc(x.name)} weniger">−</button><b>${q}</b><button class="sm" onclick="chg(${id},1)" aria-label="${esc(x.name)} mehr">+</button><span class="s">${fmt(q*x.price)}</span></div>`}).join(''):'<p class="empty">Tippe auf einen Artikel, um ihn hinzuzufügen.</p>';
 const neg=back!==null&&back<0;
 return `<div class="kasse"><section>${lastStrip()}${printStat()}<nav class="cats" role="tablist" aria-label="Kategorien">${tabs}</nav><div class="grid">${grid}</div></section>
 <aside class="panel ${sheet?'open':''}" aria-label="Bestellung">
  <div class="phead"><h2>Bestellung</h2><button class="ghost closebtn" onclick="closeSheet()">Schließen</button></div>
  ${lines}
  <div class="total"><span>Summe</span><span>${fmt(t)}</span></div>
  <label for="paid" class="hint">Gegeben</label>
  <input id="paid" type="text" inputmode="decimal" placeholder="z. B. 20" autocomplete="off" value="${esc(paid)}" oninput="setPaid(this.value)">
  <div class="quick"><button onclick="qp(${t})">Passend</button>${[5,10,20,50].map(v=>`<button onclick="qp(${v*100})">${v} €</button>`).join('')}</div>
  <div class="change ${neg?'neg':''}"><span>${neg?'Es fehlen':'Rückgeld'}</span><strong>${back===null?'–':fmt(Math.abs(back))}</strong></div>
  <button class="main" ${n&&(p===null||p>=t)?'':'disabled'} onclick="done()">Verkauf abschließen</button>

/* ---------- PIN ---------- */
function h53(str){
 let h1=0xdeadbeef,h2=0x41c6ce57;
 for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
 h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
 h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
 return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}
const pinHash=p=>h53('stoeberstuuv:'+p);
// Ziffernfeld: cb(pin) liefert true (fertig) oder eine Fehlermeldung (Text)
function pinDialog(title,hint,cb,forgot){
 let v='',err='';
 const m=document.getElementById('modal');
 const draw=()=>{
  m.innerHTML=`<div class="dlg pin" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">${title}</h2><p class="hint">${hint}</p>
  <div class="dots" role="img" aria-label="${v.length} von 4 Ziffern eingegeben">${[0,1,2,3].map(i=>`<i class="${i<v.length?'on':''}"></i>`).join('')}</div>
  <p class="perr" role="alert">${err}</p>
  <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button class="ghost" data-k="c">Abbrechen</button><button data-k="0">0</button><button data-k="b" aria-label="Letzte Ziffer löschen">⌫</button></div>
  ${forgot?'<button class="link" data-k="f">PIN vergessen?</button>':''}</div>`;
  m.classList.add('show');
  m.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>key(b.dataset.k));
 };
 const key=k=>{
  if(k==='c'){closeModal();return}
  if(k==='f'){forgotPin();return}
  if(k==='b'){v=v.slice(0,-1);err='';draw();return}
  if(v.length>=4)return;
  v+=k;err='';
  if(v.length<4){draw();return}
  const r=cb(v);
  if(r===true)closeModal();else{err=r||'';v='';draw()}
 };
 m.onclick=e=>{if(e.target===m)closeModal()};
 draw();pinCtx=key;
}
function setPin(msg){
 pinDialog('Neue PIN wählen',msg||'Wähle 4 Ziffern, die du dir gut merken kannst.',a=>{
  setTimeout(()=>pinDialog('PIN wiederholen','Gib die gleiche PIN noch einmal ein.',b=>{
   if(a!==b){setTimeout(()=>setPin('Die PINs stimmten nicht überein. Bitte neu festlegen.'),0);return true}
   st.pin=pinHash(a);save();render();toast('PIN gespeichert');return true;
  }),0);
  return true;
 });
}

function aggregate(){
 const g={byA:{},byC:{},rev:0,paying:0,pieces:0,sPieces:0,sVal:0};
 st.sales.forEach(s=>{
  if(!s.staff){g.paying++;g.rev+=s.total}
  s.items.forEach(i=>{
   const cn=i.cat||'Ohne Kategorie';
   const a=g.byA[i.name]||(g.byA[i.name]={q:0,s:0,r:0,cat:cn}),c=g.byC[cn]||(g.byC[cn]={q:0,s:0,r:0});
   a.cat=cn;
   [a,c].forEach(o=>{o.q+=i.q;if(s.staff)o.s+=i.q;else o.r+=i.q*i.price});
   g.pieces+=i.q;if(s.staff){g.sPieces+=i.q;g.sVal+=i.q*i.price}
  });
 });
 g.cOrder=[...st.cats.map(c=>c.name).filter(n=>g.byC[n]),...Object.keys(g.byC).filter(n=>!st.cats.some(c=>c.name===n))];
 return g;
}

 return `<div class="kpis"><div><small>Umsatz</small><b>${fmt(g.rev)}</b></div><div><small>Verkäufe</small><b>${g.paying}</b></div><div><small>Artikel gesamt</small><b>${g.pieces}</b></div><div class="staff"><small>Für Personal</small><b>${g.sPieces} Stk</b><small>Warenwert ${fmt(g.sVal)}</small></div></div>
 ${st.sales.length?`<h3>Nach Kategorie</h3><div class="wrap"><table>${head('Kategorie')}${g.cOrder.map(n=>row(n,g.byC[n])).join('')}</table></div>

 <div class="box"><h2>Artikel und Preise</h2><p class="hint">Nur Kategorien, Artikel und Preise, ohne Buchungen. Praktisch für ein zweites Gerät oder als Vorlage. Beim Laden bleiben die Buchungen auf dem Gerät erhalten.</p><div class="btns"><button class="ghost" onclick="doAssortSave()">Artikel und Preise speichern</button><button class="ghost" onclick="document.getElementById('af').click()">Artikel und Preise laden</button><input id="af" type="file" accept=".json,application/json" hidden onchange="doAssortLoad(this)"></div></div>
 <div class="box"><h2>Abrechnung für Excel</h2><p class="hint">Eine einfache Tabelle: pro Artikel die verkaufte Menge und der Umsatz, unten die Gesamtsumme.</p><div class="btns"><button class="ghost" onclick="doCsv()">Abrechnung als Tabelle (CSV)</button></div></div>
 <div class="box"><h2>Speicher auf diesem Gerät</h2><p class="hint" id="pers">Wird geprüft …</p></div>`;
}
function persistInfo(){
 const el=document.getElementById('pers');if(!el)return;
 const warn='Der Browser kann die Daten bei Speichermangel löschen. Sichere deshalb regelmäßig.';
 if(!(navigator.storage&&navigator.storage.persisted)){el.textContent=warn;return}
 navigator.storage.persisted().then(p=>{const e=document.getElementById('pers');if(e)e.textContent=p?'Der Browser schützt die Daten vor automatischem Löschen. Bei einem defekten oder verlorenen Gerät helfen trotzdem nur Sicherungen.':warn}).catch(()=>{});
}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
async function deliver(blob,name,type){
 // Teilen-Menü, wenn möglich (WhatsApp, Mail, Dateien ...), sonst Download
 try{
  const f=new File([blob],name,{type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return true}
 }catch(e){if(e&&e.name==='AbortError')return false}
 dl(blob,name);return true;
}
async function doBackup(){
 // Die PIN gehört bewusst nicht in die Sicherung: Ein Ersatzgerät bekommt eine neue PIN.
 const data={app:'vereinskasse',version:3,exported:new Date().toISOString(),cats:st.cats,products:st.products,sales:st.sales,next:st.next,nextCat:st.nextCat,contact:st.contact,orderNo:st.orderNo,bon:st.bon,bonCats:st.bonCats};
 const ok=await deliver(new Blob([JSON.stringify(data)],{type:'application/json'}),`vereinskasse_${stamp()}.json`,'application/json');
 if(ok){st.lastBackup=Date.now();st.backupCount=st.sales.length;save();render();toast('Sicherung erstellt');if(view==='admin'&&adminTab==='backup')persistInfo()}
 return !!ok;
}
function validAssort(d){
 const I=Number.isInteger;
 return !!d&&d.app==='vereinskasse'&&Array.isArray(d.products)
  &&(d.cats===undefined||(Array.isArray(d.cats)&&d.cats.every(c=>c&&I(c.id)&&typeof c.name==='string')))
  &&d.products.every(p=>p&&I(p.id)&&typeof p.name==='string'&&I(p.price));
}
function valid(d){
 const I=Number.isInteger;
 return validAssort(d)&&Array.isArray(d.sales)
  &&d.sales.every(s=>s&&I(s.total)&&Array.isArray(s.items)&&s.items.every(i=>i&&typeof i.name==='string'&&I(i.price)&&I(i.q)));
}
function readJson(inp,cb){
 const f=inp.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{let d=null;try{d=JSON.parse(r.result)}catch(e){}cb(d);inp.value=''};
 r.onerror=()=>{info('Fehler','Die Datei konnte nicht gelesen werden.');inp.value=''};
 r.readAsText(f);
}

 readJson(inp,d=>{

  modal({title:'Sicherung einlesen?',ok:'Ja, einlesen',okClass:'warnok',
   html:`<p>Sicherung vom ${when}: ${d.products.length} Artikel, ${d.sales.length} Buchungen.</p><p>Die aktuellen Daten auf diesem Gerät werden ersetzt.</p>`,
   onOk:()=>{
    norm(d);
    st.cats=d.cats;st.nextCat=d.nextCat;st.products=d.products;st.sales=d.sales;st.next=d.next;
    st.orderNo=d.orderNo;st.bon=d.bon;st.bonCats=d.bonCats;lastOrder=null;
    if(d.contact)st.contact=d.contact;
    st.lastBackup=Date.now();st.backupCount=st.sales.length;
    cart={};paid='';cat=st.cats[0].id;save();render();toast('Sicherung eingelesen');
   }});
 });
}
function assortData(){return{app:'vereinskasse',type:'sortiment',version:3,exported:new Date().toISOString(),cats:st.cats,products:st.products,next:st.next,nextCat:st.nextCat,bonCats:st.bonCats}}

async function doCsv(){
 if(!st.sales.length){info('Keine Buchungen','Es gibt noch keine Buchungen.');return}
 const g=aggregate();
 const q=v=>{let s=String(v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
 const rows=[['Kategorie','Artikel','Menge','davon Personal','Umsatz in €']];
 g.cOrder.forEach(cn=>{
  Object.entries(g.byA).filter(([,o])=>o.cat===cn).sort((a,b)=>b[1].q-a[1].q)
   .forEach(([n,o])=>rows.push([cn,n,o.q,o.s,eur(o.r)]));
 });
 rows.push(['Gesamt','',g.pieces,g.sPieces,eur(g.rev)]);
 const csv='﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n');
 await deliver(new Blob([csv],{type:'text/csv'}),`abrechnung_${stamp()}.csv`,'text/csv');
}

/* ---------- Küchenbon (ESC/POS über Bluetooth) ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// Häufige Bluetooth-LE-Dienste günstiger Bondrucker; der Schreibkanal wird beim Verbinden automatisch gesucht
const PRINTER_SERVICES=['000018f0-0000-1000-8000-00805f9b34fb','e7810a71-73ae-499d-8c15-faa9aef0c3f2','49535343-fe7d-4ae5-8fa9-9fafd205e455','6e400001-b5a3-f393-a0a9-e50e24dcca9e','0000ffe0-0000-1000-8000-00805f9b34fb','0000ff00-0000-1000-8000-00805f9b34fb','0000fee7-0000-1000-8000-00805f9b34fb','0000ae30-0000-1000-8000-00805f9b34fb'];
const pr={dev:null,ch:null};
const SPEED={safe:{chunk:20,delay:30},fast:{chunk:100,delay:10}};
const CP437={'ä':0x84,'ö':0x94,'ü':0x81,'Ä':0x8E,'Ö':0x99,'Ü':0x9A,'ß':0xE1,'é':0x82,'è':0x8A,'à':0x85,'â':0x83,'ê':0x88,'ç':0x87,'É':0x90,'ñ':0xA4};
const ASCII_TR={'ä':'ae','ö':'oe','ü':'ue','Ä':'Ae','Ö':'Oe','Ü':'Ue','ß':'ss','é':'e','è':'e','à':'a','â':'a','ê':'e','ç':'c','É':'E','ñ':'n'};
const bonCols=()=>st.bon.width===48?48:32;
const printerReady=()=>!!(pr.ch&&pr.dev&&pr.dev.gatt&&pr.dev.gatt.connected);
// Text für Bon und Vorschau gleich aufbereiten
function prep(s){
 let t=String(s).replace(/×/g,'x').replace(/[–—]/g,'-').replace(/€/g,'EUR').replace(/[„“”]/g,'"').replace(/[’‘]/g,"'");
 if(st.bon.charset==='ascii')t=t.replace(/[äöüÄÖÜßéèàâêçÉñ]/g,c=>ASCII_TR[c]);
 return t;
}
function enc(s){
 const o=[];
 for(const ch of s){
  const c=ch.codePointAt(0);
  if(c>=32&&c<127)o.push(c);
  else if(st.bon.charset!=='ascii'&&CP437[ch]!==undefined)o.push(CP437[ch]);
  else o.push(0x3F);
 }
 return o;
}
// Zeilenumbruch mit Einrückung der Folgezeilen, lange Wörter werden getrennt
function wrap(s,max,indent=0){
 const out=[];let cur='';
 const lim=()=>out.length?max-indent:max;
 for(let w of String(s).split(/\s+/).filter(Boolean)){
  while(w.length>lim()){
   if(cur){out.push(cur);cur=''}
   const n=lim();out.push(w.slice(0,n));w=w.slice(n);
  }
  if(!cur)cur=w;
  else if((cur+' '+w).length<=lim())cur+=' '+w;
  else{out.push(cur);cur=w}
 }
 if(cur||!out.length)out.push(cur);
 return out.map((l,i)=>(i?' '.repeat(indent):'')+l);
}
const mkAdd=(ops,cols)=>(t,o={})=>wrap(prep(t),Math.floor(cols/(o.w||1)),o.indent||0).forEach(l=>ops.push({s:l,a:o.a||'l',w:o.w||1,h:o.h||1,b:!!o.b}));
function bonItems(s){const names=st.bonCats.map(catName);return s.items.filter(i=>names.includes(i.cat))}
// Ein Bon als Liste von Zeilen (eine Quelle für Druck und Vorschau); null = keine Küchenartikel
function buildBon(s,all){
 const items=all?s.items:bonItems(s);
 if(!items.length)return null;
 const cols=bonCols(),ops=[],add=mkAdd(ops,cols),rule=()=>ops.push({s:'-'.repeat(cols),a:'l',w:1,h:1,b:false});
 const d=new Date(s.time||Date.now());
 if((st.bon.title||'').trim()){add(st.bon.title.trim(),{a:'c',b:true});rule()}
 if(s.staff)add('*** Personal ***',{a:'c',b:true,w:2,h:2});else add('Bestellung',{a:'c'});
 add(String(s.nr||'-'),{a:'c',b:true,w:4,h:4});
 add(d.toLocaleDateString('de-DE')+' '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}),{a:'c'});
 rule();
 items.forEach(i=>add(`${i.q}x ${i.name}`,{b:true,h:2,indent:String(i.q).length+2}));
 rule();
 ops.push({feed:4});
 return ops;
}
function testOps(){
 const cols=bonCols(),ops=[],add=mkAdd(ops,cols);
 add('Test-Druck',{a:'c',b:true,w:2,h:2});
 ops.push({s:'1234567890'.repeat(5).slice(0,cols),a:'l',w:1,h:1,b:false});
 add('Ä Ö Ü ä ö ü ß é',{a:'c'});
 add('2x Bratwurst',{b:true,h:2});
 add('27',{a:'c',b:true,w:4,h:4});
 add('Wenn alles lesbar ist, passen die Einstellungen.',{a:'c'});
 ops.push({feed:4});
 return ops;
}
// ESC/POS: Initialisieren, Zeichensatz, pro Zeile Ausrichtung/Größe/Fett, am Ende Vorschub (und Schnitt)
function toEscPos(ops){
 const out=[0x1B,0x40];
 if(st.bon.charset==='cn')out.push(0x1C,0x2E);
 if(st.bon.charset!=='ascii')out.push(0x1B,0x74,0x00);
 ops.forEach(o=>{
  if(o.feed){out.push(0x1B,0x64,o.feed);return}
  out.push(0x1B,0x61,{l:0,c:1,r:2}[o.a],0x1D,0x21,(((o.w-1)&15)<<4)|((o.h-1)&15),0x1B,0x45,o.b?1:0);
  enc(o.s).forEach(b=>out.push(b));
  out.push(0x0A);
 });
 out.push(0x1D,0x21,0,0x1B,0x45,0,0x1B,0x61,0);
 if(st.bon.cutter)out.push(0x1D,0x56,0x42,0x00);
 return new Uint8Array(out);
}
function opsHtml(ops){
 const cols=bonCols(),base=13,lh=18;
 return `<div class="paper" style="width:${cols}ch">`+ops.map(o=>{
  if(o.feed)return `<div style="height:${lh*1.5}px"></div>`;
  const al={l:'left',c:'center',r:'right'}[o.a];
  return `<div style="height:${lh*o.h}px;text-align:${al}"><span style="display:inline-block;font-size:${base*o.w}px;line-height:${lh*o.w}px;transform:scaleY(${o.h/o.w});transform-origin:0 0;font-weight:${o.b?700:400}">${esc(o.s)||'&nbsp;'}</span></div>`;
 }).join('')+'</div>';
}
function sampleSale(staff,nr){
 const c=catName(st.bonCats[0])||'Essen';
 return {nr,staff,time:Date.now(),items:[{q:2,name:'Bratwurst',cat:c},{q:1,name:'Pommes',cat:c},{q:1,name:'Currywurst mit Brötchen',cat:c}]};
}
function previewBon(){
 modal({title:'Bon-Vorschau',cancel:null,ok:'Schließen',
  html:opsHtml(buildBon(sampleSale(false,27),true))+opsHtml(buildBon(sampleSale(true,28),true))+'<p class="hint">So ungefähr sieht der Bon aus, oben eine normale Bestellung, darunter eine für das Personal. Gedruckt werden nur Artikel aus den Kategorien, die du für den Bon ausgewählt hast.</p>'});
}

// Bluetooth-Verbindung (Chrome auf Android)
function errText(e){
 const n=e&&e.name,m=(e&&e.message)||'';
 if(n==='NotFoundError')return 'Kein Drucker ausgewählt oder nichts gefunden. Ist der Drucker eingeschaltet und in der Nähe?';
 if(n==='SecurityError'||n==='NotAllowedError')return 'Bitte zuerst „Verbinden“ drücken und den Drucker auswählen.';
 if(n==='NetworkError')return 'Drucker nicht erreichbar. Ist er eingeschaltet und in der Nähe?';
 return m||'Unbekannter Fehler.';
}
async function openDevice(dev){
 dev.addEventListener('gattserverdisconnected',onDisc);
 const server=await dev.gatt.connect();
 let ch=null;
 for(const s of await server.getPrimaryServices()){
  for(const c of await s.getCharacteristics()){
   if(c.properties.writeWithoutResponse||c.properties.write){ch=c;break}
  }
  if(ch)break;
 }
 if(!ch){try{dev.gatt.disconnect()}catch(e){}throw new Error('Am Drucker wurde kein Schreibkanal gefunden. Dieses Modell wird vermutlich nicht unterstützt.')}
 pr.dev=dev;pr.ch=ch;st.bon.device=dev.name||st.bon.device||'';save();
}
async function connectPrinter(){
 if(!navigator.bluetooth)throw new Error('Dieser Browser kann keine Bluetooth-Drucker ansteuern. Bitte Chrome auf einem Android-Gerät verwenden.');
 const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:PRINTER_SERVICES});
 await openDevice(dev);
}
async function ensureConnected(){
 if(printerReady())return;
 if(pr.dev){await openDevice(pr.dev);return}
 if(navigator.bluetooth&&navigator.bluetooth.getDevices&&st.bon.device){
  const list=await navigator.bluetooth.getDevices().catch(()=>[]);
  const d=list.find(x=>x.name===st.bon.device);
  if(d){await openDevice(d);return}
 }
 await connectPrinter();
}
async function silentReconnect(){
 try{
  if(!st.bon.on||printerReady())return;
  if(pr.dev)await openDevice(pr.dev);
  else if(navigator.bluetooth&&navigator.bluetooth.getDevices&&st.bon.device){
   const d=(await navigator.bluetooth.getDevices()).find(x=>x.name===st.bon.device);
   if(d)await openDevice(d);
  }
 }catch(e){}
 refreshPrint();
}
function onDisc(){pr.ch=null;refreshPrint()}
function refreshPrint(){
 const el=document.querySelector('.printstat');
 if(el&&el.closest('.kasse')){const t=document.createElement('div');t.innerHTML=printStat();if(t.firstElementChild)el.replaceWith(t.firstElementChild);else el.remove()}
 if(view==='admin'&&adminTab==='more'&&!(document.activeElement&&document.activeElement.matches('input,select')))render();
}
async function sendToPrinter(bytes){
 await ensureConnected();
 const ch=pr.ch,sp=SPEED[st.bon.speed]||SPEED.safe,noResp=!!(ch.properties.writeWithoutResponse&&ch.writeValueWithoutResponse);
 for(let i=0;i<bytes.length;i+=sp.chunk){
  const part=bytes.slice(i,i+sp.chunk);
  if(noResp)await ch.writeValueWithoutResponse(part);else await ch.writeValue(part);
  await sleep(sp.delay);
 }
}
// Drucken darf eine Buchung nie blockieren: Fehler werden nur am Bestellhinweis angezeigt
async function printSale(s){
 const ops=buildBon(s);
 if(!ops)return {status:'none'};
 try{await sendToPrinter(toEscPos(ops));return {status:'ok'}}
 catch(e){return {status:'fail',err:errText(e)}}
}
async function autoPrint(sale){
 const r=await printSale(sale);
 if(lastOrder&&lastOrder.nr===sale.nr){lastOrder.print=r.status;lastOrder.err=r.err;refreshStrip()}
 refreshPrint();
}
function reprint(){
 const s=st.sales[st.sales.length-1];
 if(!s||!lastOrder||s.nr!==lastOrder.nr)return;
 lastOrder.print='busy';refreshStrip();autoPrint(s);
}
async function connectClick(){
 try{await connectPrinter();toast('Drucker verbunden')}
 catch(e){info('Drucker nicht verbunden',esc(errText(e)))}
 refreshPrint();
}
async function testPrint(){
 try{await sendToPrinter(toEscPos(testOps()));toast('Test-Druck gesendet')}
 catch(e){info('Test-Druck fehlgeschlagen',esc(errText(e)))}
 refreshPrint();
}
function setBon(k,v){st.bon[k]=v;save();render();if(k==='on'&&v)silentReconnect()}
function toggleBonCat(id,on){st.bonCats=st.bonCats.filter(x=>x!==id);if(on)st.bonCats.push(id);save()}
function bonBox(){
 const b=st.bon,on=printerReady();
 const cats=st.cats.map(c=>`<label class="chk"><input type="checkbox" ${st.bonCats.includes(c.id)?'checked':''} onchange="toggleBonCat(${c.id},this.checked)"><span>${esc(c.name)}</span></label>`).join('');
 const opt=(v,l,cur)=>`<option value="${v}" ${String(cur)===String(v)?'selected':''}>${l}</option>`;
 return `<div class="box"><h2>Küchenbon</h2>
  <p class="hint">Druckt zu jeder Bestellung einen Bon mit Nummer für die Küche. Dafür braucht es einen Bluetooth-Bondrucker mit ESC/POS und Chrome auf Android. Ohne Drucker bleibt der Schalter aus: Die Bestellnummer erscheint trotzdem nach jeder Buchung.</p>

  ${b.on?`<div class="printstat" style="margin:6px 0"><i class="${on?'on':''}"></i><span>${on?'Verbunden mit '+esc(b.device||'Drucker'):'Nicht verbunden'+(b.device?' (zuletzt: '+esc(b.device)+')':'')}</span></div>
  <div class="btns"><button class="main" onclick="connectClick()">${on?'Anderen Drucker wählen':'Drucker verbinden'}</button><button class="ghost" onclick="testPrint()">Test-Druck</button></div>
  <p style="margin-top:14px"><b>Diese Kategorien kommen auf den Bon</b></p>${cats}
  <label class="chk"><input type="checkbox" ${b.auto?'checked':''} onchange="setBon('auto',this.checked)"><span>Bon nach jeder Buchung automatisch drucken</span></label>
  <div class="field"><label class="hint" for="btitle">Kopfzeile auf dem Bon</label><input type="text" id="btitle" value="${esc(b.title)}" onchange="setBon('title',this.value.trim())"></div>
  <div class="field"><label class="hint" for="bwidth">Papierbreite</label><select id="bwidth" onchange="setBon('width',+this.value)">${opt(32,'58 mm (32 Zeichen)',b.width)}${opt(48,'80 mm (48 Zeichen)',b.width)}</select></div>
  <details class="adv"><summary>Erweitert: wenn etwas falsch gedruckt wird</summary>
   <div class="field"><label class="hint" for="bcs">Zeichensatz (bei falschen Umlauten ändern)</label><select id="bcs" onchange="setBon('charset',this.value)">${opt('437','Standard',b.charset)}${opt('cn','Chinesisch-Modus ausschalten',b.charset)}${opt('ascii','Nur einfache Zeichen (ae, oe, ue)',b.charset)}</select></div>
   <div class="field"><label class="hint" for="bsp">Übertragung (bei fehlenden Zeilen „Sicher“ wählen)</label><select id="bsp" onchange="setBon('speed',this.value)">${opt('safe','Sicher (langsamer)',b.speed)}${opt('fast','Schnell',b.speed)}</select></div>
   <label class="chk"><input type="checkbox" ${b.cutter?'checked':''} onchange="setBon('cutter',this.checked)"><span>Drucker hat einen Abschneider</span></label>
  </details>`:''}
  <div class="btns"><button class="ghost" onclick="previewBon()">Vorschau ansehen</button></div></div>`;
}

render();
if(st.bon.on)silentReconnect();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
// Erster Start ohne gespeicherte Daten: optional Artikel und Preise aus sortiment.json übernehmen (siehe README)
if(savedRaw===null&&typeof fetch==='function'){
 fetch('sortiment.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(d=>{
  try{if(localStorage.getItem('vereinskasse')!==null)return}catch(e){}
  if(validAssort(d))applyAssort(d);
 }).catch(()=>{});
}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
